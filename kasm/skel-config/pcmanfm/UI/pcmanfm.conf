[config]
mount_on_startup=1
mount_removable=1
autorun=0

[ui]
always_show_tabs=0
max_tab_chars=32
win_width=1000
win_height=650
splitter_pos=150
media_in_new_tab=1
desktop_folder_new_tab=0
view_mode=list
icon_sizes_follow_zoom=1

[desktop]
desktop_mode=1
wallpaper_mode=none
desktop_fill=1
last_xconf=0
icon_size=48
grid_width=96
grid_height=96

[shortcut]
create_desktop_shortcut=1

[volume]
automount=1

[bookmark]
bk0=/root/Desktop
